# =============================================================================
# RADIMO CORTEX CONFIGURATION
# =============================================================================
# This file defines all application settings including authentication,
# modalities, skills, load balancing, and CSV mapping rules.
# =============================================================================

# -----------------------------------------------------------------------------
# AUTHENTICATION
# -----------------------------------------------------------------------------
# Flask secret key for session management (required for production)
# Generate a secure random key: python -c "import secrets; print(secrets.token_hex(32))"
# secret_key: your_secure_random_key_here

# Basic access protection for non-admin pages (optional)
# Set to false to disable password protection entirely
access_protection_enabled: false
# access_password: Simple password for basic access protection (optional)
access_password: radimo

# Basic access protection for admin pages (optional)
# Set to false to disable password protection entirely
admin_access_protection_enabled: true
# admin_password: Password for admin pages (config, data management)
admin_password: sbzpw

# -----------------------------------------------------------------------------
# TIMEZONE
# -----------------------------------------------------------------------------
# All date/time operations use this timezone
# Examples: Europe/Berlin, Europe/Zurich, America/New_York
timezone: Europe/Berlin

# =============================================================================
# MODALITIES
# =============================================================================
# Each modality represents an imaging type (CT, MR, X-ray, Mammo).
# Workers are assigned to modality-specific queues.
#
# Fields:
#   label: Display name in UI
#   nav_color: Navigation bar color (hex)
#   hover_color: Navigation hover state (hex)
#   background_color: Page background tint (hex)
#   valid_skills: (optional) Whitelist - only show these skills for this modality
#   hidden_skills: (optional) Blacklist - hide these skills for this modality
# =============================================================================

modalities:
  ct:
    label: CT
    nav_color: '#2f5d8a'
    hover_color: '#24496b'
    background_color: '#e7f0f7'
  mr:
    label: MR
    nav_color: '#5b4a7a'
    hover_color: '#47395f'
    background_color: '#f0eef6'
  xray:
    label: X-ray
    nav_color: '#2f8c7a'
    hover_color: '#247060'
    background_color: '#e3f3ef'
    hidden_skills: [gyn, aou, cvt]

# =============================================================================
# SKILLS
# =============================================================================
# Skills represent medical specializations that workers can be assigned to.
# Each skill can be enabled/disabled per modality via skill_overrides in rules.
#
# Fields:
#   label: Display name in UI
#   button_color: Button background color (hex)
#   text_color: Button text color (hex)
#   special: If true, skill requires special handling (subspecialty teams, styling)
#   display_order: Order in UI (lower = appears first)
#   slug: URL-safe identifier (lowercase, no special chars)
#   valid_modalities: (optional) Only show skill in these modalities
#   hidden_modalities: (optional) Hide skill in these modalities
#   tooltip: (optional) Hover text / accessible full name for short labels
# =============================================================================

skills:
  notfall:
    label: Notfall
    button_color: '#d8342a'
    text_color: '#ffffff'
    special: false
    display_order: 4
    slug: notfall
  privat:
    label: Privat
    button_color: '#d4aa22'
    text_color: '#2f2412'
    special: false
    display_order: 5
    slug: privat
  gyn:
    label: Gyn
    tooltip: Gynäkologie
    button_color: '#c45d8a'
    text_color: '#ffffff'
    special: true             # Subspecialty team
    display_order: 2
    slug: gyn
  aou:
    label: AOU
    tooltip: Abdomen / Uro / Onko
    button_color: '#3478c6'
    text_color: '#ffffff'
    special: true             # Abdomen / Uro / Onko subspecialty
    display_order: 0
    slug: aou
  cvt:
    label: CVT
    tooltip: Cardio / Vask / Thorax
    button_color: '#d07a2d'
    text_color: '#ffffff'
    special: true             # Cardio / Vask / Thorax subspecialty
    display_order: 1
    slug: cvt
  mdh:
    label: MDH
    tooltip: Muskel-Skelett / Hals / Derma
    button_color: '#4a9a46'
    text_color: '#ffffff'
    special: true             # Musculoskeletal & skin subspecialty
    display_order: 3
    slug: mdh

# =============================================================================
# SPECIAL TASKS
# =============================================================================
# Optional: Add special task buttons that route to a base_skill while showing
# separately on dashboards. Each entry must be a dict.
#
# Fields:
#   name: Unique slug-friendly name
#   label: Button label
#   base_skill: Which skill to use for button styling and fallback routing
#   target_skill_modalities: (optional) List of skill_modality pairs to search
#                           e.g., [aou_ct, aou_mr] - routes to workers
#                           who have any of these combinations active (skill=1/w)
#   modalities_dashboards: List of modality dashboards to render on
#   skill_dashboards: List of skill dashboards to render on
#   allow_overflow: Whether overflow to generalists is allowed
#   display_order: Ordering (default 999)
#   tooltip: (optional) Hover text / accessible full name
#
special_tasks:
  - name: aou_ct-seg
    label: Organ Seg
    base_skill: aou
    target_skill_modalities:
      - aou_ct
      - aou_mr
    modalities_dashboards: []
    skill_dashboards: [aou]
    allow_overflow: false
    display_order: 999
  # - name: ct-herz
  #   label: CT-Herz
  #   base_skill: cvt
  #   target_skill_modalities:
  #     - cvt_ct
  #   modalities_dashboards: [ct]
  #   skill_dashboards: []
  #   allow_overflow: false
  #   display_order: 120
  # - name: mr-herz
  #   label: MR-Herz
  #   base_skill: cvt
  #   target_skill_modalities:
  #     - cvt_mr
  #   modalities_dashboards: [mr]
  #   skill_dashboards: []
  #   allow_overflow: false
  #   display_order: 121
  - name: xray-normal
    label: Normal
    base_skill: cvt
    target_skill_modalities:
      - cvt_xray
    modalities_dashboards: [xray]
    skill_dashboards: []
    allow_overflow: true
    display_order: -1
    button_color: '#3f8f82'
    text_color: '#ffffff'

# =============================================================================
# SYNTHETIC SHIFTS
# =============================================================================
# Recurring config-defined workers that are injected into the day plan even
# without a matching Medweb row.
# =============================================================================

synthetic_shifts:
  - worker_name: "Gynarzt (GYNDOC)"
    label: "Gynarzt-shift"
    weekdays: [workdays]
    times:
      default: "07:30-15:30"
      Freitag: "07:30-15:15"
    skill_overrides:
      gyn_ct: 1
      gyn_mr: 1
      notfall: -1
  - worker_name: "Notfallarzt (NDOC)"
    label: "Notfallarzt-shift"
    weekdays: [workdays]
    times:
      default: "07:30-15:30"
      Freitag: "07:30-15:15"
    skill_overrides:
      notfall_ct: 1
      notfall_mr: 1
      notfall_xray: -1
      gyn: -1

# =============================================================================
# WORKER ROSTER BASELINES
# =============================================================================
# Optional persistent baseline matrix for specific workers.
# These synthetic summary workers are hard-excluded from everything except
# their own call pools.
# =============================================================================

worker_roster:
  GYNDOC:
    full_name: "Gynarzt (GYNDOC)"
    aou_ct: 0
    aou_mr: -1
    aou_xray: -1
    cvt_ct: 0
    cvt_mr: -1
    cvt_xray: -1
    gyn_ct: 1
    gyn_mr: 1
    gyn_xray: -1
    mdh_ct: 0
    mdh_mr: -1
    mdh_xray: -1
    notfall_ct: -1
    notfall_mr: -1
    notfall_xray: -1
    privat_ct: 0
    privat_mr: -1
    privat_xray: -1
  NDOC:
    full_name: "Notfallarzt (NDOC)"
    aou_ct: 0
    aou_mr: -1
    aou_xray: -1
    cvt_ct: 0
    cvt_mr: -1
    cvt_xray: -1
    gyn_ct: -1
    gyn_mr: -1
    gyn_xray: -1
    mdh_ct: 0
    mdh_mr: -1
    mdh_xray: -1
    notfall_ct: 1
    notfall_mr: 1
    xray_notfall: -1  # Alias; normalizes to notfall_xray
    privat_ct: 0
    privat_mr: -1
    privat_xray: -1

# =============================================================================
# NO OVERFLOW (STRICT MODE) COMBINATIONS
# =============================================================================
# List of Skill_Modality combinations where overflow to generalists is disabled.
# For these combos, the normal button uses specialist-only routing - only
# specialists (skill=1 or 'w') will be assigned, never generalists (skill=0).
# This does NOT switch to strict weights by itself; strict weights are only used
# through the explicit /strict path (visible `*` button if enabled).
# Format: Skill_Modality (e.g., cvt_ct, gyn_mr)
# =============================================================================

# Examples:
#   - cvt_ct          # Cardiac CT - specialists only
#   - cvt_mr          # Cardiac MR - specialists only
no_overflow:
  - privat_ct
  - privat_mr
  - privat_xray
  - notfall_ct
  - notfall_mr
  - notfall_xray
  - mdh_xray

# =============================================================================
# STRICT BUTTON VISIBILITY
# =============================================================================
# Optional per-button UI control for the visible `*` strict button.
# Hidden by default. Keys can target either:
#   - regular buttons: skill_modality     (e.g., cvt_ct)
#   - special tasks:  taskslug_modality   (e.g., ct-herz_ct)
# Setting a key to true renders the visible `*` button, which calls /strict and
# therefore uses both strict routing and strict weights.
# =============================================================================

strict_button_visibility:
  cvt_ct: true
  cvt_mr: true
  mdh_ct: true
  mdh_mr: true

# =============================================================================
# SPECIALIST FALLBACK ROUTES (NO GENERALIST OVERFLOW)
# =============================================================================
# Optional skill-group merge routing for specialist pools.
# If a primary skill has no available specialist in a modality, the system
# searches listed fallback specialist groups in the SAME modality.
# This path is specialist-only (skill=1 or 'w'); skill=0 overflow is disabled.
#
# Format:
#   primary_skill: [fallback_skill_1, fallback_skill_2, ...]
# -----------------------------------------------------------------------------
specialist_fallback_routes: {}

# =============================================================================
# SKILL VALUE DISPLAY COLORS
# =============================================================================
# These define how skill assignment values are displayed in the prep page table.
# Values: 1 (active), 0 (passive/fallback), -1 (excluded), 'w' (weighted/assisted)
# =============================================================================

skill_value_colors:
  active:     # skill = 1 (primary assignment - actively receives work)
    color: '#2f8c7a'
  passive:    # skill = 0 (fallback only - receives work if no active workers)
    color: '#8a8f98'
  excluded:   # skill = -1 (never assign - worker explicitly excluded)
    color: '#dc3545'
  weighted:   # skill = 'w' (assisted/weighted - receives less work, supervised)
    color: '#3d6aa8'

# =============================================================================
# UI THEME COLORS
# =============================================================================
# Colors for UI elements like tabs and status messages
# =============================================================================

ui_colors:
  today_tab: '#2f8c7a'        # Teal for "Change Today" tab
  tomorrow_tab: '#f2c94c'     # Golden for "Prep Tomorrow" tab
  success: '#2f8c7a'          # Success messages
  error: '#dc3545'            # Error messages

# =============================================================================
# WORKER LOAD MONITOR
# =============================================================================
# Configuration for the worker load monitoring page
# Color thresholds determine how worker loads are color-coded
# =============================================================================

worker_load_monitor:
  color_thresholds:
    mode: "absolute"          # "absolute" or "relative" - can toggle in UI
    absolute:
      low: 3.0                # Green below this weight
      high: 7.0               # Red above this weight (yellow in between)
    relative:
      low_pct: 33             # Green below 33% of max worker load
      high_pct: 66            # Red above 66% of max worker load
  default_view: "simple"      # "simple" or "advanced"

# =============================================================================
# SCHEDULER
# =============================================================================
# Background job timings for automated tasks
# =============================================================================

scheduler:
  daily_reset_time: "07:30"   # Time to move staged tomorrow -> live today
  auto_preload_time: 14       # Hour (0-23) to preload next workday from Master CSV

# =============================================================================
# BALANCER
# =============================================================================
# Load balancing configuration for distributing work across workers
# =============================================================================

balancer:
  enabled: true                              # Enable/disable load balancing
  min_assignments_per_skill: 2               # Minimum weighted assignments gate for specialists
  warm_start_release_mode: either            # either|both: overflow unlock by time/min count policy
  imbalance_threshold_pct: 20                # Percentage threshold to trigger rebalancing
  disable_overflow_at_shift_start_minutes: 0   # Don't assign overflow in first X minutes
  disable_overflow_at_shift_end_minutes: 0     # Don't assign overflow in last X minutes
  default_w_modifier: 0.5                   # Default modifier for weighted ('w') skills

  # Hours counting for load balancing
  # Controls which entries count towards a worker's total hours in workload calculations
  hours_counting:
    shift_default: true   # type: "shift" entries count towards hours (default)
    gap_default: false    # type: "gap" entries don't count towards hours (default)

  # Quick break button settings (☕ button in prep page)
  # Creates a gap entry (all skills = -1) at current time
  # NOTE: gap_type must match a task with type: "gap" in medweb_mapping.rules
  quick_break:
    duration_minutes: 30          # Duration of the break in minutes
    gap_type: "Break"             # Gap type label - must match a gap task name below

  # Exclusion-based routing configuration
  # Define which workers to EXCLUDE when requesting each skill
  # Workers with excluded_skill=1 won't receive work for this skill
  #
  # Format examples:
  #   skill: []                    # No exclusions - anyone can receive
  #   skill: [skill1]              # Exclude workers with skill1=1
  #   skill: [skill1, skill2]      # Exclude workers with skill1=1 OR skill2=1
  exclude_skills:
    notfall: []      # gyn can not get emergency work
    privat: []       # No exclusions - anyone can get private patients
    gyn: []
    mdh: []
    aou: []
    cvt: []

# =============================================================================
# MEDWEB CSV MAPPING CONFIGURATION
# =============================================================================
#
# This section defines how CSV activity descriptions are mapped to shifts/gaps.
# Rules are evaluated in order; first match wins.
#
# SHIFT RULES:
#   - match: "Activity Name"           # Substring to match in CSV activity
#     type: "shift"
#     training: true|false             # OPTIONAL: weighted/training rows enabled by default
#     times:                           # REQUIRED: Day-specific times
#       default: "07:30-15:45"         # Default time (Mon-Thu unless overridden)
#       Montag: "08:00-16:00"          # Optional: Monday override
#       Freitag: "07:30-15:45"         # Optional: Friday override
#     skill_overrides:                 # REQUIRED: Defines skills & modalities
#       notfall_ct: 1                  # Skill_Modality: value (1, 0, -1, w)
#     modifier: 1.0                    # OPTIONAL: Workload modifier (0.5-1.5)
#     counts_for_hours: true           # OPTIONAL: Count in load balancing
#
# GAP RULES:
#   - match: "Board"                   # Substring to match
#     type: "gap"
#     times:                           # Day-specific times (arrays supported)
#       Montag:
#         - "10:00-11:00"
#     skill_overrides:
#       all: -1                        # Shortcut: exclude from all skills
#
# HOW DAY PLANS ARE BUILT:
#   1. Worker has multiple CSV entries → all matching rules are processed
#   2. Multiple shifts → later shift ENDS prior shift (no overlap)
#   3. Multiple gaps → all gaps are subtracted from shifts
#   4. Gaps ALWAYS WIN over shifts
#   5. Standalone gap with no shift → creates "unavailable" entry
#
# =============================================================================

vendor_mappings:
  medweb:
    # Column name mappings for this vendor's CSV format
    columns:
      date: "Datum"                           # Date column
      activity: "Beschreibung der Aktivität"  # Activity description (matched against rules)
      employee_name: "Name des Mitarbeiters"  # Worker name
      employee_personalnummer: "Personalnummer"  # Authoritative worker ID / initials
      employee_code: "Code des Mitarbeiters"  # Legacy/internal worker code fallback
      day_part: "Tageszeit"                   # Optional: VM/NM import column for rule filters
                                              # Inclusive matching:
                                              # - day_part: VM/NM matches one part
                                              # - day_parts: [VM, NM] matches either VM or NM
                                              # - VM+NM rows are treated as VM/Früh for rule matching
                                              # - NM-only rows stay NM/Spät
                                              # - if omitted, day_parts default to [VM, VMNM, NM]

    # Rules for mapping activities to shifts/gaps
    # Rules are evaluated in order; first match wins.
    # Keep rules grouped by theme for readability (Privat, Notfall, specialty,
    # late shifts, admin shifts, gaps). If you move rules, preserve the
    # relative order of overlapping matches to avoid behavior changes.
    rules:

    # =========================================================================
    # PRIVAT SHIFTS (private patients by modality)
    # =========================================================================
    # These rules keep privat activity scoped to the specific modality.
    # Set all: -1 to exclude other modalities, then enable the target one(s).

    - match: "SBZ: Privatbefundung"
      type: "shift"
      day_parts: [VM, VMNM]
      times:
        default: "07:30-15:30"
        Freitag: "07:30-15:15"
      skill_overrides:
        all: -1
        privat_mr: 1
        privat_ct: 1

    - match: "OA / FA Chir"
      type: "shift"
      day_parts: [VM, VMNM]
      times:
        default: "07:30-16:15"
      skill_overrides:
        all: -1
        privat_xray: 1

    - match: "Chir Assistent"
      type: "shift"
      day_parts: [VM, VMNM]
      times:
        default: "07:30-16:15"
      skill_overrides:
        all: -1
        gyn_xray: 1
        aou_xray: 1
        cvt_xray: 1
        mdh_xray: 1
        notfall_xray: 1

    # =========================================================================
    # NOTFALL SHIFTS (emergency coverage across modalities)
    # =========================================================================
    # Activate Notfall across all modalities for emergency coverage.

    - match: "Assistent Notfall"
      type: "shift"
      day_parts: [VM, VMNM]
      times:
        default: "07:30-15:30"
        Freitag: "07:30-15:15"
      skill_overrides:
        notfall_ct: 1
        notfall_mr: 1
        notfall_xray: -1

    # - match: "UNZ Assistent"
    #   type: "shift"
    #   times:
    #     default: "07:30-11:00"
    #   skill_overrides:
    #     notfall_ct: 1
    #     notfall_mr: 1
    #     notfall_xray: 1

    # =========================================================================
    # SUBSPECIALTY SHIFTS (assistant level)
    # =========================================================================

    - match: "SBZ: Abdomen/Onko/Uro"
      label: "SBZ: Abdomen/Onko/Uro NM"
      type: "shift"
      day_part: NM
      times:
        default: "12:00-15:30"
        Freitag: "12:00-15:15"
      modifier: 1.0
      skill_overrides:
        all: 0
        aou_ct: 1
        aou_mr: 1
        gyn_ct: -1
        gyn_mr: -1
        gyn_xray: -1
        notfall_ct: -1
        notfall_mr: -1
        notfall_xray: -1
        aou_xray: -1
        cvt_xray: -1
        mdh_xray: -1
        privat_xray: -1

    - match: "SBZ: Cardio/Vask/Thorax"
      label: "SBZ: Cardio/Vask/Thorax NM"
      type: "shift"
      day_part: NM
      times:
        default: "12:00-15:30"
        Freitag: "12:00-15:15"
      modifier: 1.0
      skill_overrides:
        all: 0
        cvt_ct: 1
        cvt_mr: 1
        gyn_ct: -1
        gyn_mr: -1
        gyn_xray: -1
        notfall_ct: -1
        notfall_mr: -1
        notfall_xray: -1
        aou_xray: -1
        cvt_xray: -1
        mdh_xray: -1

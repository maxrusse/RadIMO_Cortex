<!DOCTYPE html>
<html lang="{{ default_language|default('de') }}" data-default-language="{{ default_language|default('de') }}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RadIMO Cortex{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="{{ url_for('static', filename='js/i18n.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/dialog_focus.js') }}" defer></script>
  {% block head_extra %}{% endblock %}
  <style>
    {% block base_styles %}{% endblock %}
    {% include 'partials/header_styles.html' %}
    {% block styles %}{% endblock %}
  </style>
</head>

<body{% block body_attrs %}{% endblock %}>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
</body>

</html>
